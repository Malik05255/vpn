name: Arab VPN Android CI

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Arab VPN Debug
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble standalone debug APK
        run: ./gradlew --no-daemon :arabvpn:assembleDebug
      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arab-vpn-debug-apk
          path: arabvpn/build/outputs/apk/debug/arabvpn-debug.apk
          if-no-files-found: error
          retention-days: 14

  startup-smoke-test:
    name: APK Startup Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build standalone debug APK
        run: ./gradlew --no-daemon :arabvpn:assembleDebug
      - name: Boot emulator, install and launch Arab VPN
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            APK="arabvpn/build/outputs/apk/debug/arabvpn-debug.apk"
            adb logcat -c
            adb install -r "$APK"
            adb shell am start -W -n com.malik05255.arabvpn/com.arabvpn.app.MainActivity
            sleep 5
            if ! adb shell pidof com.malik05255.arabvpn >/dev/null; then
              echo "Arab VPN process died during startup"
              adb logcat -d -v threadtime | tail -500
              exit 1
            fi
            if adb logcat -d -v threadtime | grep -A80 -B20 -E "FATAL EXCEPTION|Process: com.malik05255.arabvpn"; then
              echo "Fatal runtime crash detected"
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F "com.malik05255.arabvpn" >/dev/null

  unit-tests:
    name: Arab VPN Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Arab VPN unit tests
        run: ./gradlew --no-daemon :arabvpn:testDebugUnitTest

  android-lint:
    name: Arab VPN Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run standalone Android lint
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :arabvpn:lintDebug
          status=$?
          if [ "$status" -ne 0 ]; then
            report="arabvpn/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== FULL ARAB VPN LINT REPORT ====="
              cat "$report"
            fi
            exit "$status"
          fi

  release-build:
    name: Assemble Arab VPN Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify minified release build
        run: ./gradlew --no-daemon :arabvpn:assembleRelease
