name: Arab VPN Upgrade Smoke Test

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-smoke-test:
    name: Install New APK Over Previous
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download previous stable-signed development APK
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG=$(gh release list --limit 50 --json tagName,isDraft \
            --jq '[.[] | select(.tagName | startswith("arab-vpn-dev-v")) | select(.isDraft == false)][0].tagName // ""')
          if [ -z "$PREV_TAG" ]; then
            echo "No published Arab VPN development release is available" >&2
            exit 1
          fi
          mkdir -p upgrade-test
          gh release download "$PREV_TAG" -p 'ArabVPN-dev.apk' --dir upgrade-test
          echo "Testing upgrade from $PREV_TAG"

      - name: Build newer APK with same development signing key
        shell: bash
        run: |
          chmod +x gradlew ci/arab-vpn-upgrade-smoke-test.sh
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="upgrade-smoke.${GITHUB_RUN_NUMBER}"
          ./gradlew --no-daemon :arabvpn:assembleDebug \
            -ParabVpnVersionCode="$VERSION_CODE" \
            -ParabVpnVersionName="$VERSION_NAME"
          cp arabvpn/build/outputs/apk/debug/arabvpn-debug.apk upgrade-test/current.apk

      - name: Boot emulator and verify install-over-previous
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./ci/arab-vpn-upgrade-smoke-test.sh
